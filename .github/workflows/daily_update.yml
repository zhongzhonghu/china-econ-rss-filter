name: Daily RSS Update

on:
  schedule:
    - cron: '0 2 * * *'   # UTC 02:00 = 北京时间 10:00
  workflow_dispatch:        # 允许在 GitHub Actions 页面手动触发

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 允许 push 回仓库

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 缓存 SQLite 数据库，避免每次重新抓取和分类所有文章
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/articles.sqlite
          key: articles-db-${{ github.run_id }}
          restore-keys: articles-db-

      - name: Create .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > .env << EOF
          LLM_PROVIDER=openai
          LLM_MODEL=gpt-4o-mini
          OPENAI_API_KEY=${OPENAI_API_KEY}
          MAX_ARTICLES_PER_RUN=400
          EOF

      - name: Create feeds.yaml (public feeds + private wechat)
        env:
          WECHAT_RSS_URL: ${{ secrets.WECHAT_RSS_URL }}
        run: |
          cp config/feeds_public.yaml config/feeds.yaml
          python - << 'PYEOF'
          import os, yaml
          url = os.environ.get('WECHAT_RSS_URL', '').strip()
          if not url:
              print("No WECHAT_RSS_URL secret, skipping wechat feed")
          else:
              with open('config/feeds.yaml', 'r') as f:
                  data = yaml.safe_load(f)
              data['feeds'].append({
                  'source_id': 'wechat_all',
                  'name': '微信公众号合集',
                  'url': url,
                  'source_type': 'wechat',
                  'source_quality_score': 0.82,
                  'language': 'zh',
                  'region_scope': 'china',
                  'primary_topic_hint': 'T01',
                  'topic_hints': 'T01;T03;T17',
                  'enabled': True,
                  'notes': '个人微信公众号订阅合集',
                  'priority_group': 'normal',
              })
              with open('config/feeds.yaml', 'w') as f:
                  yaml.dump(data, f, allow_unicode=True, default_flow_style=False)
              print(f"Wechat feed added: {url[:50]}...")
          PYEOF

      - name: Run pipeline
        # 跳过 import-sources（feeds.yaml 已由上一步生成），直接从 fetch 开始
        run: |
          python -m src.main fetch
          python -m src.main classify
          python -m src.main digest
          python -m src.main feed
          python -m src.main publish-assets

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # 只有 docs/ 有变化才提交
          git diff --staged --quiet || git commit -m "chore: update feed $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
